# Hearthboard on a Synology NAS (Container Manager → Project → Create → paste this).
# Then open http://<nas-ip>:8080/edit from a phone or PC and choose a PIN.
services:
  hearthboard:
    image: ghcr.io/i-press-buttons/hearthboard:latest
    # Or build it yourself from a clone of the repo:
    # build: .
    container_name: hearthboard
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      # Your time zone, so "today", all-day events and night dimming are right.
      TZ: America/Chicago
      # Run as your DSM user so it can read your photos. Find these with `id` over SSH
      # (the first DSM user is usually 1026, group "users" is 100).
      PUID: '1026'
      PGID: '100'
      # How often calendars are polled, in seconds.
      HEARTHBOARD_SYNC_INTERVAL: '60'
      # Optional: set the admin PIN here instead of on first visit.
      # HEARTHBOARD_PIN: "2468"
      # Optional: an HTTPS address that reaches this container (e.g. via DSM's reverse
      # proxy + Let's Encrypt) lets Google sign-in redirect straight back.
      # HEARTHBOARD_PUBLIC_URL: "https://board.example.synology.me"
      # Try it with sample data first:
      # HEARTHBOARD_DEMO: "1"
    volumes:
      # Settings, layouts, the calendar cache and encrypted account credentials.
      - ./data:/data
      # Your Synology Photos library, read-only. Personal space:
      - /volume1/homes/YOUR_DSM_USER/Photos:/photos:ro
      # ...or the shared space instead:
      # - /volume1/photo:/photos:ro
